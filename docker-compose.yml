services:
  postgres:
    image: postgres:17-alpine

    container_name: meeting-room-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingroom}
      POSTGRES_USER: ${POSTGRES_USER:-meetingroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingroom_dev_password}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetingroom} -d ${POSTGRES_DB:-meetingroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine

    container_name: meeting-room-keycloak-db

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0

    container_name: meeting-room-keycloak

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081

    ports:
      - "8081:8080"

    depends_on:
      keycloak-db:
        condition: service_healthy

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: meeting-room-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@meetingroom.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-meetingroom_dev_password}

    ports:
      - "5050:80"

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  backend:
    build:
      context: ./backend/MeetingRoom.Api
      dockerfile: Dockerfile

    container_name: meeting-room-backend

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-meetingroom};Username=${POSTGRES_USER:-meetingroom};Password=${POSTGRES_PASSWORD:-meetingroom_dev_password}
      Keycloak__Authority: http://keycloak:8080/realms/meeting-room
      Keycloak__MetadataAddress: http://keycloak:8080/realms/meeting-room/.well-known/openid-configuration
      Keycloak__ValidIssuer: http://localhost:8081/realms/meeting-room
      Keycloak__Audience: meeting-room-api
      Keycloak__RequireHttpsMetadata: "false"

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-postgres-data:
  pgadmin-data:
